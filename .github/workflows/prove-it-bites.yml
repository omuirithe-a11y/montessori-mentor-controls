name: prove-it-bites

# Every change, and once a week: try every forbidden action on purpose and confirm it is blocked.
# If any one gets through, this run fails and GitHub emails the repository owner.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  prove-it-bites:
    name: prove-it-bites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser used to measure spacing
        run: |
          python -m pip install --quiet playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Try every forbidden action
        run: python tests/prove_it_bites.py
